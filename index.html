<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>

    <div class="layout">
        <aside class="sidebar compacto">
            <section style="padding:12px 0;">
                <label for="tema" style="color:var(--cor-principal); margin-right:8px;">ESCOLHA O TEMA:</label>
                <select id="tema">
                    <option value="REGGAE">REGGAE</option>

                    <option value="ANIME2000S">ANIME2000S</option>
                    <option value="RAP-ANIME">RAP-ANIME</option>
                </select>
            </section>

            <nav class="nav-vertical" aria-label="Lista de vídeos do tema">
                <ul id="menu-temas"></ul>
            </nav>

            <br>
            <h1 style="font-size:15px; color:var(--cor-principal); margin:16px 0; text-align:left;">
                VÍDEOS EXTERNOS DO YOUTUBE👇
            </h1>
            <nav class="nav-vertical" aria-label="Vídeos fixos">
                <ul>
                    <li><a href="https://youtu.be/R_ZDB8Me5oA?si=m-JS9IXMXmYtARJl">VídeO FODAO</a></li>
                    <li><a href="https://youtu.be/Njh70nvCPVI?si=kQnUvRBWNGgw4iJJ">Vídeo Externo 2</a></li>
                    <li><a href="https://youtu.be/4G7kRHQdmq0?si=-349b2ErPBpxgNL8">Vídeo Externo 3</a></li>
                    <li><a href="https://youtu.be/5dv75GW1ErU?si=YFxyb-4P1F9sMVhP">Vídeo Externo 4</a></li>
                    <li><a href="https://youtu.be/6RGM3TQJSWQ?si=oGGWvpRBWfztrinL">Vídeo Externo 5</a></li>
                </ul>
            </nav>
        </aside>

        <main class="player">
            <div class="video-box">
                <iframe
                    class="video-frame"
                    width="200"
                    height="400"
                    src="https://www.youtube.com/embed/6X5krhF4RdA"
                    title="Player de vídeo"
                    frameborder="0"
                    allowfullscreen
                ></iframe>

                <div class="info">
                    <h3>MEU AMIGO É</h3>
                    <p>MC SID</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const TEMAS = {
            REGGAE: [
                { titulo: "MEU AMIGO É",
                  autor: "MC SID",
                  url: "https://youtu.be/6X5krhF4RdA?si=NLXHsmo7nE7AhExL"
                },
                { titulo: "MEU PAI É RASTAFARI",
                  autor: "MANEVA",
                  url: "https://youtu.be/j-3ATZ6x6EA?si=FOVM5KAmGH2SdKEP"
                },
                { titulo: "SAUDADES DO TEMPO",
                  autor: "MANEVA",
                  url: "https://youtu.be/hpOWZVu7sKY?si=yMnK4JPAKOxbMC-v"
                },
                { titulo: "MEU LUGAR",
                  autor: "ONZE20",
                  url: "https://youtu.be/NcPtnX_7PrM?si=lSzCInyrbh1V_40w"
                },
                { titulo: "SORRI, SOU REI",
                  autor: "NATIRUTS",
                  url: "https://youtu.be/8Xv6FZ_6V60?si=CsE6fSG3AZ64nA3F"
                },
            ],
            "POP-CLASSICO": [
                { titulo: "DYNAMITE",
                  autor: "TAIO CRUZ",
                  url: "https://youtu.be/VUjdiDeJ0xg?si=sXAzKtkOcB6xeetf"
                },
                { titulo: "I GOTTA FEELING",
                  autor: "BLACK EYED PEAS",
                  url: "https://youtu.be/CwdrtwZiQ9E?si=VajnYBmydA7CUVK3"
                },
                { titulo: "TIK TOK",
                  autor: "KE$HA",
                  url:"https://youtu.be/iP6XpLQM2Cs?si=nVgmXVDfcmPgvcll"
                },
                { titulo: "DANÇA KUDURO",
                  autor: "DON OMAR FT.LUCENZO",
                  url: "https://youtu.be/7zp1TbLFPp8?si=pmCATMzeWRYBLceF"
                },
                { titulo: "MADAGASCAR",
                  autor: "EDY LEMOND",
                  url: "https://youtu.be/b3m9G4gADPQ?si=MnT7uA_iWBFh13nF"
                },
            ],
            ANIME2000S: [
                { titulo: "BOOM BOOM BOOM",
                  autor: "LEATHER",
                  url: "https://youtu.be/1TzYnfcxNNE?si=5k1pw38qUu5_unUV"
                },
                { titulo: "Caramelldansen HD Version",
                  autor: "CARAMELLA GIRLS",
                  url: "https://youtu.be/PDJLvF1dUek?si=yCgHHDY0k8FCGd57"
                },
                { titulo: "Everytime we touch",
                  autor: "Nightcore",
                  url: "https://youtu.be/8QG7CEuUqMc?si=jhhk6y_UsxaEZh2Y"
                },
                { titulo: "Bad boy",
                  autor: "Nightcore",
                  url: "https://youtu.be/cmlCuzn_mqI?si=rqLEpxk5vBdClp7j"
                },
                { titulo: "La canción más pegadiza del mundo",
                  autor: "LEVAN POLKA",
                  url: "https://youtu.be/tlXSMrGWK9M?si=XAipKvM3o5Dd3N8v"
                },
            ],
            "RAP-ANIME": [
                { titulo: "rap do levi",
                  autor: "byakuran",
                  url: "https://youtu.be/FyAd9ZYQlQk?si=EdRh6yXG1dpUzmxu"
                },
                { titulo: "O cara que comeu a kaguya",
                  autor: "byakuran",
                  url: "https://youtu.be/JQqf2UXjUaw?si=cfxYM6tzhgm39B36"
                },
            ],
        };

        const selectTema = document.getElementById("tema");
        const menuUl = document.getElementById("menu-temas");
        const iframeEl = document.querySelector(".video-box iframe");
        const infoTitulo = document.querySelector(".info h3");
        const infoAutor = document.querySelector(".info p");

        function toEmbed(url) {
            const youtubeRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(youtubeRegex);
            if (match && match[1]) {
                return `https://www.youtube.com/embed/${match[1]}`;
            }
            return url;
        }

        function renderMenu(tema) {
            const lista = TEMAS[tema] || [];
            menuUl.innerHTML = "";

            lista.forEach((video) => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#";
                a.textContent = video.titulo.toUpperCase();
                a.setAttribute("role", "button");
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    trocarVideo(video);
                });
                li.appendChild(a);
                menuUl.appendChild(li);
            });

            if (lista.length) trocarVideo(lista[0]);
        }

        function trocarVideo(video) {
            iframeEl.src = toEmbed(video.url);
            infoTitulo.textContent = video.titulo.toUpperCase();
            infoAutor.textContent = `${video.autor.toUpperCase()}.`;
        }

        // Initialization
        renderMenu(selectTema.value);
        selectTema.addEventListener("change", () => renderMenu(selectTema.value));
    </script>
</body>
</html>
